name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance 서명을 위한 OIDC 토큰. 없으면 --provenance 가 실패한다.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # 태그와 package.json 이 어긋난 채로 배포되는 사고를 여기서 막는다.
      # 버전은 한 번 쓰면 재사용할 수 없어 되돌릴 방법이 없다.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      # 이미 올라간 버전은 npm 이 재업로드를 거절한다. 다만 손으로 먼저 배포하고 태그를
      # 나중에 붙이는 순서에서도 이건 정상이므로, 실패가 아니라 건너뛰기로 처리한다.
      # (v0.1.9 가 정확히 이 순서였고 그래서 빨간 X 가 떴다.)
      - name: Already on npm?
        id: published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "react-path-picker@$PKG" version >/dev/null 2>&1; then
            echo "::notice::react-path-picker@$PKG is already on npm — skipping the publish step"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # publish 가 404 로 죽으면 npm 이 '권한 없음'을 숨긴 것이다(패키지 존재를 안 알리려고).
      # 토큰이 누구로 인증되는지 먼저 찍어야 원인이 갈린다 — 사용자명만 나오고 토큰은 안 나온다.
      # granular token 은 whoami 에 필요한 스코프가 없어 401 이 날 수 있다. 정보용일 뿐이니
      # 여기서 배포를 막지 않는다 — 진짜 판정은 아래 Publish 의 응답으로 한다.
      - name: Token identity
        if: steps.published.outputs.skip != 'true'
        continue-on-error: true
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # prepublishOnly 가 typecheck·test·build 를 한 번 더 돌린다. 위 단계는 어디서
      # 깨졌는지 로그로 바로 보이게 하려는 것.
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
