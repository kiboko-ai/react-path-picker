name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance 서명을 위한 OIDC 토큰. 없으면 --provenance 가 실패한다.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # 태그와 package.json 이 어긋난 채로 배포되는 사고를 여기서 막는다.
      # 버전은 한 번 쓰면 재사용할 수 없어 되돌릴 방법이 없다.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: Already on npm?
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "react-path-picker@$PKG" version >/dev/null 2>&1; then
            echo "::error::react-path-picker@$PKG is already published"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # prepublishOnly 가 typecheck·test·build 를 한 번 더 돌린다. 위 단계는 어디서
      # 깨졌는지 로그로 바로 보이게 하려는 것.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
